<script type="application/json" id="donnees">{"titre": "Formation : de Spring Boot (A1) à Grails 3.3 + GORM + MariaDB (A2)", "construit": "2026-10-25T04:18:36+00:00", "sections": [{"id": "presentation", "num": "", "court": "Présentation", "qcm": null, "parent": null, "md": "## Présentation\n\nCette formation fait passer un développeur Spring Boot (A1 : Thymeleaf + Spring MVC + Spring Data) à Grails 3.3 (A2 : GSP + contrôleurs/services Groovy + GORM sur MariaDB orientée calcul) en 3 jours de tutoriels, puis 8 exercices notés sur un dépôt partagé.\n\nChaque module part d'un besoin métier concret du même fil rouge, **Facturo**, une mini-application de facturation (clients, produits, factures, lignes). Le besoin est réalisé d'abord en A1, que les stagiaires connaissent, puis en A2. La comparaison côte à côte sert d'ancrage : on n'apprend pas Grails « de zéro », on apprend ce qui change.\n\n**Public** : développeurs Java ayant déjà livré une application Spring Boot MVC avec JPA. **Prérequis poste** : JDK 8 (Grails 3.3 ne supporte pas Java 11+ en pratique), Grails 3.3.11 via SDKMAN, Docker pour MariaDB 10.11, un IDE (IntelliJ IDEA recommandé pour le support Groovy/GSP), Git.\n\n**Objectifs à l'issue de la formation**, le stagiaire sait :\n\n1. Retrouver dans un projet Grails l'équivalent de chaque élément d'un projet Spring Boot, et savoir ce que la convention fait à sa place.\n2. Écrire une fonctionnalité complète GSP → contrôleur → service → GORM.\n3. Décider ce qui se calcule en base (fonction, vue, procédure, trigger) et l'intégrer proprement côté Grails.\n4. Livrer son travail dans Git de façon lisible, avec et sans assistant IA, en documentant l'usage de l'IA.\n\n### Déroulé\n\n| Module | Besoin métier traité | Notions A2 introduites | Durée |\n| --- | --- | --- | --- |\n| 0 | Démarrer le projet | Structure, conventions, `application.yml`, `dbCreate: none` | 1 h |\n| 1 | Lister les clients | Domain class + mapping, finders, contrôleur, GSP, layout | 2 h |\n| 2 | Créer / modifier un client | `constraints`, data binding, command object, `flash`, `g:hasErrors` | 2 h |\n| 3 | Saisir une facture et ses lignes | `hasMany` / `belongsTo`, service `@Transactional`, `g:render` | 2 h 30 |\n| 4 | Rechercher des factures | `where`, criteria, pagination, `g:paginate`, `UrlMappings` | 1 h 30 |\n| 5.1 | Passer de la boucle Java à la requête | SQL ensembliste, table de traduction, critères de partage | 1 h |\n| 5.2 | Partager la règle de montant | Fonctions `DETERMINISTIC` / `READS SQL DATA`, `formula` | 1 h |\n| 5.3 | Afficher les totaux sans N+1 | Vue, domain en lecture seule, `EXPLAIN` | 1 h 30 |\n| 5.4 | Émettre une facture | Procédure participante, `IN` / `OUT`, `SIGNAL`, `Sql.call`, procédure à `SELECT` | 2 h |\n| 5.5 | Geler et auditer les factures | Contraintes déclaratives, triggers `BEFORE` / `AFTER` | 1 h |\n| 5.6 | Choisir et assembler | Arbre de décision, atelier remise fidélité | 1 h 30 |\n| 6 | Factoriser le transverse | Interceptor, TagLib, i18n | 1 h 30 |\n| QCM | Valider les acquis | 5 questions par module ou séance | 1 h 15 |\n\n### Table de correspondance A1 ↔ A2\n\n| Préoccupation | A1 — Spring Boot | A2 — Grails 3.3 / MariaDB | Ce qui change vraiment |\n| --- | --- | --- | --- |\n| Vue | Template Thymeleaf `templates/*.html`, attributs `th:*` | GSP `grails-app/views/<contrôleur>/<action>.gsp`, tags `<g:*>` et `${}` | La vue est trouvée par convention, sans `return \"vue\"` |\n| Mise en page | Thymeleaf Layout Dialect / fragments | SiteMesh : `layouts/main.gsp` + `<meta name=\"layout\">` | Le layout « enveloppe » la page après rendu |\n| Fragment réutilisable | `th:fragment` / `th:replace` | Template `_nom.gsp` + `<g:render template=\"nom\">` | Le souligné est obligatoire dans le nom de fichier |\n| Composant de vue | Dialecte Thymeleaf custom (rare) | TagLib Groovy `grails-app/taglib` | Écrire un tag est trivial, on le fait souvent |\n| Routage | `@GetMapping(\"/clients\")` sur la méthode | Convention `/<contrôleur>/<action>/<id>` + `UrlMappings.groovy` | Le routage est centralisé, pas sur les méthodes |\n| Contrôleur | `@Controller`, méthode qui renvoie un nom de vue | Classe `*Controller` dans `grails-app/controllers`, action qui renvoie une `Map` (le modèle) | Pas d'annotation ; `params`, `flash`, `request` sont implicites |\n| Liaison formulaire | `@ModelAttribute` + `BindingResult` | Arguments d'action, command object, `bindData` | La validation est portée par l'objet (`obj.errors`) |\n| Intercepteur | `HandlerInterceptor` + `WebMvcConfigurer` | `*Interceptor` dans `grails-app/controllers` avec `match(...)` | Enregistrement automatique |\n| Service | `@Service` + injection par constructeur | Classe `*Service` dans `grails-app/services`, injection par nom de propriété | Singleton par défaut, injection par convention de nommage |\n| Transaction | `@Transactional` (Spring) | `@grails.gorm.transactions.Transactional` (GORM 6) | Ce n'est plus l'annotation Spring ; les services ne sont plus transactionnels implicitement |\n| Entité | `@Entity` JPA, getters/setters | Domain class Groovy `grails-app/domain`, propriétés simples | `id` et `version` ajoutés automatiquement |\n| Validation | Bean Validation `@NotBlank`, `@Size` | Bloc `static constraints = { ... }` | Validée à `validate()` / `save()` |\n| Mapping table | `@Table`, `@Column`, `@JoinColumn` | Bloc `static mapping = { ... }` | Indispensable en mode « base d'abord » |\n| Accès données | `interface ClientRepository extends JpaRepository` | Méthodes statiques sur la classe : `Client.findAllByActif(true)`, `Client.where {}` | Pas de repository : la classe de domaine *est* le point d'accès |\n| Requête dynamique | `Specification`, `@Query` JPQL | `where` query, `createCriteria()`, HQL `executeQuery` | Les closures `where` sont vérifiées à la compilation |\n| SQL natif / procédure | `@Query(nativeQuery=true)`, `@Procedure`, `SimpleJdbcCall` | `groovy.sql.Sql` sur le `dataSource` injecté | Une ligne de Groovy remplace l'outillage JDBC |\n| Schéma | `spring.jpa.hibernate.ddl-auto` + Flyway | `dataSource.dbCreate` (ici `none`) + scripts SQL versionnés | La base est la source de vérité : GORM s'y adapte |\n| Calcul métier | Souvent en Java dans le service | En base : fonctions, vues, procédures, triggers | Le service orchestre, la base calcule |\n"}, {"id": "m0", "num": "0", "court": "Mettre en place le projet", "qcm": "0", "parent": null, "md": "## Module 0 — Mettre en place le projet\n\n**Besoin** : démarrer Facturo sur une base MariaDB déjà structurée par des scripts SQL. En A2, l'emplacement d'un fichier décide de son rôle : il n'y a ni `@Controller`, ni `@Service`, ni `@Entity`.\n\n### Où sont les choses\n\n| Rôle | A1 — Spring Boot | A2 — Grails 3.3 |\n| --- | --- | --- |\n| Point d'entrée | `src/main/java/.../FacturoApplication.java` | `grails-app/init/facturo/Application.groovy` |\n| Données de démarrage | `CommandLineRunner`, `data.sql` | `grails-app/init/facturo/BootStrap.groovy` |\n| Configuration | `src/main/resources/application.yml` | `grails-app/conf/application.yml` |\n| Contrôleurs | package `web`, annotation `@Controller` | `grails-app/controllers/facturo/*Controller.groovy` |\n| Services | package `service`, `@Service` | `grails-app/services/facturo/*Service.groovy` |\n| Entités | package `domain`, `@Entity` | `grails-app/domain/facturo/*.groovy` |\n| Repositories | package `repository` | aucun : méthodes statiques GORM |\n| Vues | `src/main/resources/templates` | `grails-app/views` |\n| Messages | `messages.properties` | `grails-app/i18n/messages*.properties` |\n| Statique | `src/main/resources/static` | `grails-app/assets` (Asset Pipeline) |\n| Classes utilitaires | `src/main/java` | `src/main/groovy` |\n| Tests | `src/test/java` (JUnit) | `src/test/groovy` (Spock, unitaire) et `src/integration-test/groovy` |\n\n### Configuration de la source de données\n\nEn A1, on règle `spring.datasource.*` et `spring.jpa.hibernate.ddl-auto: validate`. En A2, le bloc `dataSource` de `application.yml` joue le même rôle. Le point clé de ce projet : la base est créée par les scripts SQL, donc **`dbCreate: none`**. Avec la valeur par défaut du profil web (`create-drop` en dev), Hibernate effacerait les vues et procédures au premier démarrage.\n\n```yaml\n# A1 — src/main/resources/application.yml\nspring:\n  datasource:\n    url: jdbc:mariadb://localhost:3306/facturo\n    username: facturo\n    password: facturo\n  jpa:\n    hibernate.ddl-auto: validate\n    open-in-view: false\n```\n\n```yaml\n# A2 — grails-app/conf/application.yml (extrait)\nhibernate:\n    cache: { queries: false, use_second_level_cache: false }\ndataSource:\n    pooled: true\n    driverClassName: org.mariadb.jdbc.Driver\n    dialect: org.hibernate.dialect.MySQL5InnoDBDialect\n    username: facturo\n    password: facturo\n    dbCreate: none          # la base est gérée par src/main/sql/*.sql\n    url: jdbc:mariadb://localhost:3306/facturo\n```\n\nLe pilote se déclare dans `build.gradle` : `runtime \"org.mariadb.jdbc:mariadb-java-client:2.7.12\"` (la branche 2.x reste compatible Java 8).\n\n### Commandes du quotidien\n\n| Action | A1 | A2 |\n| --- | --- | --- |\n| Lancer | `./mvnw spring-boot:run` | `./gradlew bootRun` ou `grails run-app` |\n| Tests | `./mvnw test` | `./gradlew check` ou `grails test-app` |\n| Générer une classe | (IDE) | `grails create-domain-class facturo.Produit`, `create-controller`, `create-service`, `create-taglib` |\n| Console interactive | jshell (peu utile) | `grails console` : exécute du GORM contre la base |\n| Base de données | `docker compose up -d` | identique, les scripts de `src/main/sql` s'exécutent à la création du conteneur |\n\nÀ retenir : en Grails, renommer `ClientController` en `ClientsController` change l'URL et l'emplacement des vues. La convention est un contrat.\n"}, {"id": "m1", "num": "1", "court": "Lister les clients actifs", "qcm": "1", "parent": null, "md": "## Module 1 — Lister les clients actifs\n\n**Besoin** : afficher les clients actifs triés par raison sociale, avec un lien vers leur fiche. Quatre fichiers en A1 (entité, repository, contrôleur, template), trois en A2 (domain, contrôleur, GSP), plus un layout commun.\n\n### Table existante\n\n```sql\nCREATE TABLE client (\n  id             BIGINT AUTO_INCREMENT PRIMARY KEY,\n  version        BIGINT NOT NULL DEFAULT 0,\n  code           VARCHAR(20)  NOT NULL UNIQUE,\n  raison_sociale VARCHAR(120) NOT NULL,\n  email          VARCHAR(120),\n  taux_remise    DECIMAL(5,2) NOT NULL DEFAULT 0,\n  actif          BOOLEAN      NOT NULL DEFAULT TRUE,\n  date_creation  DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP\n);\n```\n\n### A1 — Spring Boot\n\n```java\n@Entity @Table(name = \"client\")\npublic class Client {\n  @Id @GeneratedValue(strategy = GenerationType.IDENTITY) private Long id;\n  @Version private Long version;\n  private String code;\n  @Column(name = \"raison_sociale\") private String raisonSociale;\n  private String email;\n  @Column(name = \"taux_remise\") private BigDecimal tauxRemise;\n  private boolean actif;\n  @Column(name = \"date_creation\", insertable = false, updatable = false) private LocalDateTime dateCreation;\n  // getters / setters\n}\n\npublic interface ClientRepository extends JpaRepository<Client, Long> {\n  List<Client> findByActifTrueOrderByRaisonSocialeAsc();\n}\n\n@Controller @RequestMapping(\"/clients\")\npublic class ClientController {\n  private final ClientRepository repo;\n  public ClientController(ClientRepository repo) { this.repo = repo; }\n\n  @GetMapping\n  public String index(Model model) {\n    model.addAttribute(\"clients\", repo.findByActifTrueOrderByRaisonSocialeAsc());\n    return \"client/index\";\n  }\n}\n```\n\n```html\n<!-- templates/client/index.html -->\n<html xmlns:th=\"http://www.thymeleaf.org\" xmlns:layout=\"http://www.ultraq.net.nz/thymeleaf/layout\"\n      layout:decorate=\"~{layout}\">\n<body><section layout:fragment=\"content\">\n  <h1>Clients actifs<\/h1>\n  <table>\n    <tr th:each=\"c : ${clients}\">\n      <td><a th:href=\"@{/clients/{id}(id=${c.id})}\" th:text=\"${c.code}\"><\/a><\/td>\n      <td th:text=\"${c.raisonSociale}\"><\/td>\n      <td th:text=\"${#numbers.formatDecimal(c.tauxRemise, 1, 2)} + ' %'\"><\/td>\n    <\/tr>\n  <\/table>\n  <p th:if=\"${#lists.isEmpty(clients)}\">Aucun client.<\/p>\n<\/section><\/body><\/html>\n```\n\n### A2 — Grails 3.3\n\n```groovy\n// grails-app/domain/facturo/Client.groovy\npackage facturo\n\nclass Client {\n    String code\n    String raisonSociale        // -> colonne raison_sociale (stratégie de nommage par défaut)\n    String email\n    BigDecimal tauxRemise = 0\n    Boolean actif = true\n    Date dateCreated            // nom magique : rempli automatiquement par GORM\n\n    static mapping = {\n        table 'client'\n        dateCreated column: 'date_creation'\n        sort 'raisonSociale'\n    }\n}\n```\n\n```groovy\n// grails-app/controllers/facturo/ClientController.groovy\npackage facturo\n\nclass ClientController {\n    def index() {\n        [clients: Client.findAllByActif(true)]   // la Map renvoyée = le modèle\n    }                                          // vue : views/client/index.gsp\n}\n```\n\n```html\n<%-- grails-app/views/client/index.gsp --%>\n<html>\n<head>\n  <meta name=\"layout\" content=\"main\"/>\n  <title>Clients<\/title>\n<\/head>\n<body>\n<h1>Clients actifs<\/h1>\n<table>\n  <g:each in=\"${clients}\" var=\"c\">\n    <tr>\n      <td><g:link action=\"show\" id=\"${c.id}\">${c.code}<\/g:link><\/td>\n      <td>${c.raisonSociale}<\/td>\n      <td><g:formatNumber number=\"${c.tauxRemise}\" format=\"0.00\"/> %<\/td>\n    <\/tr>\n  <\/g:each>\n<\/table>\n<g:if test=\"${!clients}\"><p>Aucun client.<\/p><\/g:if>\n<\/body>\n<\/html>\n```\n\n```html\n<%-- grails-app/views/layouts/main.gsp --%>\n<!doctype html>\n<html lang=\"fr\">\n<head>\n  <title><g:layoutTitle default=\"Facturo\"/><\/title>\n  <asset:stylesheet src=\"application.css\"/>\n  <g:layoutHead/>\n<\/head>\n<body>\n  <nav><g:link controller=\"client\">Clients<\/g:link> · <g:link controller=\"facture\">Factures<\/g:link><\/nav>\n  <g:if test=\"${flash.message}\"><div class=\"message\">${flash.message}<\/div><\/g:if>\n  <main><g:layoutBody/><\/main>\n<\/body>\n<\/html>\n```\n\n### Ce qu'il faut retenir\n\n- **Pas de repository** : `Client.findAllByActif(true)` est un *dynamic finder*, généré à l'exécution à partir du nom, comme une méthode dérivée Spring Data, mais statique sur la classe.\n- **`id` et `version` sont implicites** dans la domain class ; `version` active le verrouillage optimiste, comme `@Version`.\n- **Le tri par défaut** (`sort` dans `mapping`) s'applique à toutes les requêtes de liste, là où A1 l'encode dans le nom de méthode.\n- **`${...}` est échappé en HTML** par défaut en Grails 3 (codec `html`), comme `th:text`. Pour du HTML brut : `${raw(x)}`, l'équivalent de `th:utext`.\n- **Le layout est choisi par la page** via `<meta name=\"layout\">` ; SiteMesh fusionne `<head>` et `<body>` de la page dans le gabarit.\n"}, {"id": "m2", "num": "2", "court": "Créer et modifier un client avec validation", "qcm": "2", "parent": null, "md": "## Module 2 — Créer et modifier un client avec validation\n\n**Besoin** : saisir un client (code unique en majuscules, raison sociale obligatoire, e-mail valide, remise entre 0 et 30 %), réafficher le formulaire avec les erreurs, sinon rediriger vers la fiche avec un message. En A2 la règle de validation vit dans la domain class, et l'objet lié porte lui-même ses erreurs.\n\n### A1 — Spring Boot\n\n```java\npublic class ClientForm {\n  @NotBlank @Size(min = 3, max = 20) @Pattern(regexp = \"[A-Z0-9-]+\") private String code;\n  @NotBlank @Size(max = 120) private String raisonSociale;\n  @Email private String email;\n  @DecimalMin(\"0.0\") @DecimalMax(\"30.0\") private BigDecimal tauxRemise = BigDecimal.ZERO;\n  // getters / setters\n}\n\n@PostMapping\npublic String save(@Valid @ModelAttribute(\"client\") ClientForm form, BindingResult br, RedirectAttributes ra) {\n  if (repo.existsByCode(form.getCode())) br.rejectValue(\"code\", \"client.code.unique\");\n  if (br.hasErrors()) return \"client/create\";\n  Client c = clientService.creer(form);\n  ra.addFlashAttribute(\"message\", \"Client \" + c.getCode() + \" créé\");\n  return \"redirect:/clients/\" + c.getId();\n}\n```\n\n```html\n<form th:action=\"@{/clients}\" th:object=\"${client}\" method=\"post\">\n  <input th:field=\"*{code}\"/> <span th:errors=\"*{code}\"><\/span>\n  <input th:field=\"*{raisonSociale}\"/> <span th:errors=\"*{raisonSociale}\"><\/span>\n  <button>Créer<\/button>\n<\/form>\n```\n\n### A2 — Grails 3.3\n\nLes contraintes s'ajoutent à la domain class du module 1. L'unicité est une contrainte comme les autres : GORM fait la requête de vérification.\n\n```groovy\n// Client.groovy (ajout)\nstatic constraints = {\n    code          blank: false, size: 3..20, matches: /[A-Z0-9-]+/, unique: true\n    raisonSociale blank: false, maxSize: 120\n    email         nullable: true, email: true, maxSize: 120\n    tauxRemise    min: 0.0, max: 30.0, scale: 2\n    dateCreated   nullable: true, bindable: false   // jamais alimenté depuis un formulaire\n}\n```\n\nL'accès aux données passe par un **GORM Data Service** : une interface annotée dont GORM génère l'implémentation transactionnelle. C'est l'équivalent le plus proche d'un `JpaRepository`.\n\n```groovy\n// grails-app/services/facturo/ClientService.groovy\npackage facturo\nimport grails.gorm.services.Service\n\n@Service(Client)\ninterface ClientService {\n    Client get(Serializable id)\n    List<Client> list(Map args)\n    Long count()\n    Client save(Client client)        // lève ValidationException si invalide\n    void delete(Serializable id)\n}\n```\n\n```groovy\n// ClientController.groovy (ajout)\nimport grails.validation.ValidationException\n\nclass ClientController {\n    ClientService clientService                     // injecté par son nom\n    static allowedMethods = [save: 'POST', update: 'PUT']\n\n    def create() { [client: new Client(params)] }\n\n    def save(Client client) {                       // params -> nouvel objet lié\n        try {\n            clientService.save(client)\n        } catch (ValidationException e) {\n            render view: 'create', model: [client: client]   // client.errors est rempli\n            return\n        }\n        flash.message = message(code: 'client.cree', args: [client.code])\n        redirect action: 'show', id: client.id\n    }\n\n    def edit(Long id) { [client: clientService.get(id)] }\n\n    def update(Client client) {                     // id présent -> instance chargée PUIS liée\n        try {\n            clientService.save(client)\n        } catch (ValidationException e) {\n            render view: 'edit', model: [client: client]\n            return\n        }\n        flash.message = message(code: 'client.modifie', args: [client.code])\n        redirect action: 'show', id: client.id\n    }\n}\n```\n\n```html\n<%-- views/client/create.gsp (corps) --%>\n<g:hasErrors bean=\"${client}\">\n  <ul class=\"errors\">\n    <g:eachError bean=\"${client}\" var=\"err\"><li><g:message error=\"${err}\"/><\/li><\/g:eachError>\n  <\/ul>\n<\/g:hasErrors>\n<g:form action=\"save\">\n  <label>Code <g:textField name=\"code\" value=\"${client?.code}\"/><\/label>\n  <label>Raison sociale <g:textField name=\"raisonSociale\" value=\"${client?.raisonSociale}\"/><\/label>\n  <label>E-mail <g:field type=\"email\" name=\"email\" value=\"${client?.email}\"/><\/label>\n  <label>Remise (%) <g:field type=\"number\" step=\"0.01\" name=\"tauxRemise\" value=\"${client?.tauxRemise}\"/><\/label>\n  <g:submitButton name=\"creer\" value=\"Créer\"/>\n<\/g:form>\n```\n\nPour la modification : `<g:form action=\"update\" id=\"${client.id}\" method=\"PUT\">` et `<g:hiddenField name=\"version\" value=\"${client.version}\"/>`, pour que le verrouillage optimiste détecte une modification concurrente.\n\nLes messages suivent la convention `<classe>.<propriété>.<contrainte>` dans `messages_fr.properties` : `client.code.unique=Le code {2} est déjà utilisé.` (`{0}` = propriété, `{1}` = classe, `{2}` = valeur saisie).\n\n### Command object : quand le formulaire n'est pas l'entité\n\nPour un formulaire qui ne correspond pas à une table (le DTO de A1), on écrit une classe `Validateable`. Grails la lie et la valide avant d'entrer dans l'action.\n\n```groovy\nclass RemiseCommand implements grails.validation.Validateable {\n    Long clientId\n    BigDecimal taux\n    String motif\n    static constraints = { taux min: 0.0, max: 30.0; motif blank: false, size: 5..200 }\n}\n\ndef appliquerRemise(RemiseCommand cmd) {\n    if (cmd.hasErrors()) { render view: 'remise', model: [cmd: cmd]; return }\n    // ...\n}\n```\n\n### Ce qu'il faut retenir\n\n- `BindingResult` disparaît : l'objet lié expose `hasErrors()` et `errors`, et la vue les lit avec `g:hasErrors` / `g:eachError`.\n- `render view:` réaffiche (équivalent de `return \"client/create\"`), `redirect` fait le Post-Redirect-Get, `flash` survit à une seule redirection comme `RedirectAttributes`.\n- Liaison de masse : tout paramètre HTTP homonyme d'une propriété est lié. Protéger avec `bindable: false`, une liste blanche `bindData(obj, params, [include: [...]])` ou un command object.\n- Un Data Service est transactionnel et lève `ValidationException` ; un `client.save()` appelé directement renvoie `null` sans exception si la validation échoue. C'est le piège n°1 en venant de Spring.\n"}, {"id": "m3", "num": "3", "court": "Saisir une facture et ses lignes", "qcm": "3", "parent": null, "md": "## Module 3 — Saisir une facture et ses lignes\n\n**Besoin** : créer une facture brouillon pour un client, y ajouter des lignes produit (prix, TVA et remise client recopiés au moment de l'ajout), refuser toute modification dès que la facture n'est plus en brouillon. Le cœur du module : la différence entre une **composition** (`belongsTo`) et une simple **référence**, et la place du service transactionnel.\n\n### A1 — Spring Boot\n\n```java\n@Entity\npublic class Facture {\n  @Id @GeneratedValue(strategy = GenerationType.IDENTITY) private Long id;\n  @Version private Long version;\n  private String numero;\n  @ManyToOne(fetch = FetchType.LAZY) @JoinColumn(name = \"client_id\") private Client client;\n  @Enumerated(EnumType.STRING) private StatutFacture statut = StatutFacture.BROUILLON;\n  @OneToMany(mappedBy = \"facture\", cascade = CascadeType.ALL, orphanRemoval = true)\n  @OrderBy(\"id\") private List<LigneFacture> lignes = new ArrayList<>();\n\n  public void ajouter(LigneFacture l) { l.setFacture(this); lignes.add(l); }\n}\n\n@Service\npublic class FactureService {\n  @Transactional\n  public LigneFacture ajouterLigne(Long factureId, Long produitId, int quantite) {\n    Facture f = factures.findById(factureId).orElseThrow();\n    if (f.getStatut() != StatutFacture.BROUILLON) throw new FactureNonModifiableException(factureId);\n    Produit p = produits.findById(produitId).orElseThrow();\n    LigneFacture l = new LigneFacture(p, quantite, p.getPrixUnitaireHt(), p.getTauxTva(), f.getClient().getTauxRemise());\n    f.ajouter(l);\n    return l;               // dirty checking : flush au commit\n  }\n}\n```\n\n```html\n<!-- fragments/lignes.html -->\n<tr th:fragment=\"ligne(l)\"><td th:text=\"${l.produit.libelle}\"><\/td><td th:text=\"${l.quantite}\"><\/td><\/tr>\n<!-- facture/show.html -->\n<tr th:each=\"l : ${facture.lignes}\" th:replace=\"~{fragments/lignes :: ligne(${l})}\"><\/tr>\n```\n\n### A2 — Grails 3.3\n\n```groovy\n// grails-app/domain/facturo/Facture.groovy\nclass Facture {\n    String numero                       // attribué par la base à l'émission (module 5)\n    Client client                       // simple référence : PAS de belongsTo\n    Date dateFacture = new Date()\n    StatutFacture statut = StatutFacture.BROUILLON\n    Date dateEmission\n\n    static hasMany = [lignes: LigneFacture]\n\n    static constraints = {\n        numero nullable: true, unique: true\n        dateEmission nullable: true\n    }\n    static mapping = {\n        statut enumType: 'string'\n        lignes cascade: 'all-delete-orphan', sort: 'id'\n    }\n}\n\n// grails-app/domain/facturo/LigneFacture.groovy\nclass LigneFacture {\n    Produit produit\n    Integer quantite\n    BigDecimal prixUnitaireHt\n    BigDecimal tauxTva\n    BigDecimal remisePct = 0\n\n    static belongsTo = [facture: Facture]   // composition : la ligne n'existe pas sans sa facture\n    static constraints = {\n        quantite min: 1\n        prixUnitaireHt min: 0.0, scale: 2\n        remisePct min: 0.0, max: 100.0\n    }\n}\n```\n\n```groovy\n// grails-app/services/facturo/FactureService.groovy\npackage facturo\nimport grails.gorm.transactions.Transactional\n\n@Transactional\nclass FactureService {\n\n    Facture creerBrouillon(Long clientId) {\n        new Facture(client: Client.load(clientId)).save(failOnError: true)\n    }\n\n    LigneFacture ajouterLigne(Long factureId, Long produitId, Integer quantite) {\n        Facture f = Facture.get(factureId)\n        if (f.statut != StatutFacture.BROUILLON) throw new FactureNonModifiableException(factureId)\n        Produit p = Produit.get(produitId)\n        def ligne = new LigneFacture(produit: p, quantite: quantite,\n                prixUnitaireHt: p.prixUnitaireHt, tauxTva: p.tauxTva,\n                remisePct: f.client.tauxRemise)\n        f.addToLignes(ligne)            // remplit aussi ligne.facture\n        f.save(failOnError: true)\n        ligne\n    }\n\n    @Transactional(readOnly = true)\n    Facture detail(Long id) {\n        Facture.findById(id, [fetch: [lignes: 'join', client: 'join']])\n    }\n}\n\n// src/main/groovy/facturo/FactureNonModifiableException.groovy\nclass FactureNonModifiableException extends RuntimeException { ... }\n```\n\n```html\n<%-- views/facture/_ligne.gsp --%>\n<tr>\n  <td>${ligne.produit.libelle}<\/td>\n  <td>${ligne.quantite}<\/td>\n  <td><g:formatNumber number=\"${ligne.prixUnitaireHt}\" type=\"currency\" currencyCode=\"EUR\"/><\/td>\n<\/tr>\n\n<%-- views/facture/show.gsp (extrait) --%>\n<table><g:render template=\"ligne\" collection=\"${facture.lignes}\" var=\"ligne\"/><\/table>\n<g:if test=\"${facture.statut == facturo.StatutFacture.BROUILLON}\">\n  <g:form action=\"ajouterLigne\" id=\"${facture.id}\">\n    <g:select name=\"produitId\" from=\"${produits}\" optionKey=\"id\" optionValue=\"libelle\"/>\n    <g:field type=\"number\" name=\"quantite\" min=\"1\" value=\"1\"/>\n    <g:submitButton name=\"ajouter\" value=\"Ajouter\"/>\n  <\/g:form>\n<\/g:if>\n```\n\n### Ce qu'il faut retenir\n\n- **`belongsTo` = cascade de suppression.** Le mettre sur `Facture` vers `Client` ferait disparaître les factures avec le client. On le réserve à la composition (`LigneFacture` → `Facture`).\n- **`addToLignes`** est l'équivalent de la méthode `ajouter()` qu'on écrit à la main en JPA pour tenir les deux côtés de la relation.\n- **L'annotation est `grails.gorm.transactions.Transactional`**, pas celle de Spring. Une `RuntimeException` annule la transaction ; en Groovy aucune exception n'est « checked », donc les exceptions métier étendent `RuntimeException`.\n- **N+1** : les associations sont *lazy* comme en JPA. `fetch: [lignes: 'join']` joue le rôle de `JOIN FETCH` ou `@EntityGraph`.\n- **`Client.load(id)`** crée un proxy sans requête, comme `getReferenceById`.\n- **Template** : fichier `_ligne.gsp`, appelé `template=\"ligne\"` ; `collection` + `var` remplacent la boucle `th:each`.\n"}, {"id": "m4", "num": "4", "court": "Rechercher des factures", "qcm": "4", "parent": null, "md": "## Module 4 — Rechercher des factures\n\n**Besoin** : rechercher les factures par client, statut et période (critères tous optionnels), paginées par 10, triables par colonne, avec une URL lisible `/factures/recherche`. A1 compose des `Specification` ; A2 compose des requêtes `where` ou un *criteria*, et la pagination tient dans deux tags.\n\n### A1 — Spring Boot\n\n```java\npublic interface FactureRepository extends JpaRepository<Facture, Long>, JpaSpecificationExecutor<Facture> {}\n\n@GetMapping(\"/factures/recherche\")\npublic String recherche(RechercheForm f, @PageableDefault(size = 10, sort = \"dateFacture\",\n                        direction = Sort.Direction.DESC) Pageable pageable, Model model) {\n  Specification<Facture> spec = Specification.where(null);\n  if (f.getClientId() != null) spec = spec.and((r, q, cb) -> cb.equal(r.get(\"client\").get(\"id\"), f.getClientId()));\n  if (f.getStatut() != null)   spec = spec.and((r, q, cb) -> cb.equal(r.get(\"statut\"), f.getStatut()));\n  if (f.getDu() != null)       spec = spec.and((r, q, cb) -> cb.greaterThanOrEqualTo(r.get(\"dateFacture\"), f.getDu()));\n  model.addAttribute(\"page\", factures.findAll(spec, pageable));   // Page<Facture>\n  return \"facture/recherche\";\n}\n```\n\n### A2 — Grails 3.3\n\n```groovy\n// src/main/groovy/facturo/RechercheFactureCommand.groovy\nclass RechercheFactureCommand implements grails.validation.Validateable {\n    Long clientId\n    StatutFacture statut\n    Date du, au\n    static constraints = { clientId nullable: true; statut nullable: true; du nullable: true; au nullable: true }\n}\n\n// FactureService.groovy (ajout)\n@Transactional(readOnly = true)\nMap rechercher(RechercheFactureCommand cmd, Map pagination) {\n    Long cid = cmd.clientId; StatutFacture st = cmd.statut; Date du = cmd.du; Date au = cmd.au\n    def q = Facture.where {}                         // DetachedCriteria, composable\n    if (cid) q = q.where { client.id == cid }\n    if (st)  q = q.where { statut == st }\n    if (du)  q = q.where { dateFacture >= du }\n    if (au)  q = q.where { dateFacture <= au }\n    [factures: q.list(pagination), total: q.count()]\n}\n\n// FactureController.groovy (ajout)\ndef recherche(RechercheFactureCommand cmd) {\n    params.max = Math.min(params.int('max') ?: 10, 100)\n    def pagination = [max: params.max, offset: params.int('offset') ?: 0,\n                      sort: params.sort ?: 'dateFacture', order: params.order ?: 'desc']\n    factureService.rechercher(cmd, pagination) + [cmd: cmd, clients: Client.list()]\n}\n```\n\nVariante *criteria*, utile quand la requête a des jointures ou des projections : `Facture.createCriteria().list(max: 10, offset: 0) { if (cid) client { eq 'id', cid }; order 'dateFacture', 'desc' }` renvoie un `PagedResultList` qui expose `totalCount`.\n\n```html\n<%-- views/facture/recherche.gsp (extrait) --%>\n<g:form action=\"recherche\" method=\"GET\">\n  <g:select name=\"clientId\" from=\"${clients}\" optionKey=\"id\" optionValue=\"raisonSociale\"\n            value=\"${cmd?.clientId}\" noSelection=\"['': 'Tous les clients']\"/>\n  <g:select name=\"statut\" from=\"${facturo.StatutFacture.values()}\" value=\"${cmd?.statut}\"\n            noSelection=\"['': 'Tous statuts']\"/>\n  <g:submitButton name=\"chercher\" value=\"Rechercher\"/>\n<\/g:form>\n<table>\n  <thead><tr>\n    <g:sortableColumn property=\"numero\" title=\"Numéro\" params=\"${params}\"/>\n    <g:sortableColumn property=\"dateFacture\" title=\"Date\" params=\"${params}\"/>\n    <th>Client<\/th><th>Statut<\/th>\n  <\/tr><\/thead>\n  <g:each in=\"${factures}\" var=\"f\"> ... <\/g:each>\n<\/table>\n<g:paginate total=\"${total}\" params=\"${params}\"/>\n```\n\n```groovy\n// grails-app/controllers/facturo/UrlMappings.groovy\nclass UrlMappings {\n    static mappings = {\n        \"/factures\"(controller: 'facture', action: 'index')\n        \"/factures/recherche\"(controller: 'facture', action: 'recherche')\n        \"/factures/$id\"(controller: 'facture', action: 'show') { constraints { id matches: /\\d+/ } }\n        \"/$controller/$action?/$id?(.$format)?\" { constraints { } }   // règle par convention\n        \"/\"(controller: 'client')\n        \"500\"(view: '/error')\n        \"404\"(view: '/notFound')\n    }\n}\n```\n\n### Ce qu'il faut retenir\n\n- **`where {}` renvoie un `DetachedCriteria`** non exécuté : on l'affine par appels successifs, comme `Specification.and()`. Il n'est exécuté qu'à `list()`, `count()` ou `get()`.\n- **Copier les critères dans des variables locales** avant la closure `where` : la transformation AST de GORM les traite comme des paramètres.\n- **Pagination** : `max`, `offset`, `sort`, `order` sont des paramètres HTTP ordinaires que `g:paginate` et `g:sortableColumn` savent produire. Toujours borner `max` côté serveur.\n- **`params.int('max')`** convertit sans exception (renvoie `null` si invalide) ; on a aussi `params.long()`, `params.boolean()`, `params.date('du', 'yyyy-MM-dd')`.\n- **`UrlMappings`** centralise le routage ; `<g:link controller=\"facture\" action=\"recherche\">` génère automatiquement `/factures/recherche` (*reverse mapping*).\n"}, {"id": "m5", "num": "5", "court": "Penser en base", "qcm": null, "parent": null, "md": "## Module 5 — Penser en base (6 séances, 8 h)\n\nCe module est le plus long parce qu'il change un réflexe, pas seulement une syntaxe. En A1, le développeur écrit ses calculs en Java : une boucle dans le service, une `@Query` sur le repository, parfois un test dans le contrôleur. En A2, la base calcule et Grails orchestre. Avant de savoir écrire une vue ou une procédure, il faut savoir reconnaître ce qui gagne à y aller, et ce qui doit rester en Groovy.\n\nLe module avance donc en six temps : on apprend d'abord à traduire un algorithme Java en requête ensembliste (5.1), puis on étudie un objet par séance (5.2 à 5.5), toujours avec la même grille, et on finit par composer ces objets dans une fonctionnalité complète (5.6).\n\n| Séance | Question traitée | Objet MariaDB | Durée | Exercice lié |\n| --- | --- | --- | --- | --- |\n| 5.1 | Comment passer d'une boucle Java à une requête ? | aucun : SQL ensembliste | 1 h | — |\n| 5.2 | Comment partager une règle de calcul ? | Fonction | 1 h | Ex. 4 |\n| 5.3 | Comment exposer un résultat calculé à GORM ? | Vue | 1 h 30 | Ex. 4, 8 |\n| 5.4 | Comment exécuter une opération atomique en plusieurs écritures ? | Procédure stockée | 2 h | Ex. 5 |\n| 5.5 | Comment garantir une règle quel que soit le programme qui écrit ? | Trigger | 1 h | Ex. 7 |\n| 5.6 | Quel objet choisir, et comment les assembler ? | Tous | 1 h 30 | Ex. 8 |\n\n**Grille commune aux séances 5.2 à 5.5** : le réflexe A1, l'objet en base, son appel depuis Grails, quand l'utiliser, quand s'en abstenir, les pièges, puis ce qu'il faut retenir. Le fil rouge est toujours le même : le total d'une facture, puis son émission. Tous les objets SQL montrés sont dans `src/main/sql/01_routines_ventes.sql` du dépôt et ont été exécutés sur MariaDB 10.11.\n"}, {"id": "m5-1", "num": "5.1", "court": "Du Java au SQL ensembliste", "qcm": "5.1", "parent": "m5", "md": "## 5.1 — Du Java au SQL ensembliste\n\n**Idée clé** : un algorithme Java parcourt des objets un par un ; une requête SQL décrit le résultat attendu sur tout un ensemble, et la base choisit comment le produire. Tant que ce changement n'est pas fait, une procédure stockée n'est qu'une boucle Java réécrite dans un langage moins confortable.\n\n### Le réflexe A1 : le calcul est dans le service\n\n```java\n@Transactional(readOnly = true)\npublic BigDecimal totalTtc(Long factureId) {\n  Facture f = factures.findById(factureId).orElseThrow();      // 1 requête\n  BigDecimal total = BigDecimal.ZERO;\n  for (LigneFacture l : f.getLignes()) {                        // + 1 requête (lignes lazy)\n    BigDecimal ht = l.getPrixUnitaireHt()\n        .multiply(BigDecimal.valueOf(l.getQuantite()))\n        .multiply(BigDecimal.ONE.subtract(l.getRemisePct().movePointLeft(2)))\n        .setScale(2, RoundingMode.HALF_UP);\n    total = total.add(ht.multiply(BigDecimal.ONE.add(l.getTauxTva().movePointLeft(2)))\n        .setScale(2, RoundingMode.HALF_UP));\n  }\n  return total;\n}\n// Écran « liste des factures » : la même méthode appelée pour chacune des 50 factures -> 1 + 50 x 2 requêtes\n```\n\nLe palier intermédiaire connu en A1 est la `@Query` JPQL. Elle supprime la boucle, mais dès que la règle se complique (remise, arrondi ligne à ligne, TVA), le JPQL devient illisible et la règle finit dupliquée entre Java et la requête.\n\n```java\n@Query(\"select sum(l.quantite * l.prixUnitaireHt) from LigneFacture l where l.facture.id = :id\")\nBigDecimal totalHtBrut(@Param(\"id\") Long id);   // ni remise, ni arrondi : ce n'est plus la même règle\n```\n\n### La même règle, pour toutes les factures, en une requête\n\n```sql\nSELECT facture_id,\n       SUM(ROUND(ROUND(quantite * prix_unitaire_ht * (1 - remise_pct / 100), 2)\n                 * (1 + taux_tva / 100), 2)) AS total_ttc\n  FROM ligne_facture\n GROUP BY facture_id;\n```\n\nSur le jeu d'essai, la facture 1 donne 213,98 €, au centime près comme la version Java : `ROUND` sur un `DECIMAL` arrondit la demie en s'éloignant de zéro, comme `RoundingMode.HALF_UP`.\n\n### Table de traduction\n\n| En Java | En SQL | Remarque |\n| --- | --- | --- |\n| `for` + accumulateur | `SUM`, `COUNT`, `AVG`, `MIN`, `MAX` | Sur tout l'ensemble d'un coup |\n| `Collectors.groupingBy(..., summing...)` | `GROUP BY` | Une ligne de résultat par clé |\n| `if` / `else` dans la boucle | `CASE WHEN ... THEN ... ELSE ... END` | Expression, pas instruction |\n| `stream().filter(...)` avant le calcul | `WHERE` | Filtre les lignes |\n| filtre sur un total déjà calculé | `HAVING` | Filtre les groupes |\n| boucles imbriquées pour croiser deux listes | `JOIN` | La base choisit l'ordre et les index |\n| `anyMatch` / `noneMatch` | `EXISTS` / `NOT EXISTS` | S'arrête dès la première ligne |\n| `sorted()` / `limit(n)` | `ORDER BY` / `LIMIT n` |  |\n| `Optional.orElse(BigDecimal.ZERO)` | `COALESCE(x, 0)` | `NULL` se propage dans tout calcul |\n| `setScale(2, HALF_UP)` | `ROUND(x, 2)` sur `DECIMAL` | Jamais `FLOAT` ni `DOUBLE` pour de l'argent |\n| compteur `synchronized` ou `AtomicLong` | table de séquence + verrou de ligne | Seule façon sûre avec plusieurs serveurs |\n\n### Où doit vivre le calcul ?\n\n| Critère | Reste en Groovy | Va en base |\n| --- | --- | --- |\n| Volume | Quelques objets déjà chargés | Beaucoup de lignes, ou des agrégats |\n| Réutilisation | Un seul écran | Plusieurs écrans, rapports, autres programmes |\n| Atomicité | Une seule écriture | Plusieurs écritures liées, avec concurrence |\n| Portée de la règle | Préférence d'affichage | Invariant qui doit tenir quel que soit l'auteur de l'écriture |\n| Dépendances | E-mail, API, fichier, session HTTP | Uniquement des données de la base |\n| Nature de l'algorithme | Nombreuses branches, formatage de texte, règle qui change souvent | Filtrer, joindre, agréger, verrouiller |\n\n### Atelier flash (15 min)\n\nPour chacun de ces besoins, dire où il vit et pourquoi ; la séance 5.6 donne le corrigé sous forme d'arbre de décision.\n\n1. Afficher le total TTC de chaque facture dans une liste paginée.\n2. Envoyer un e-mail au client quand sa facture est émise.\n3. Numéroter les factures sans trou ni doublon, avec deux serveurs d'application.\n4. Interdire de modifier une facture émise, y compris par un script de reprise de données.\n5. Interdire un stock négatif.\n\n### Ce qu'il faut retenir\n\n- Une boucle qui accumule est presque toujours un `GROUP BY` ; un `if` dans la boucle est un `CASE`.\n- Calculer en Java ce que la base peut agréger coûte au minimum une requête par objet : c'est le N+1 du module 3, en pire.\n- Ce qui touche l'extérieur de la base (e-mail, API, fichier) reste en Groovy, toujours.\n"}, {"id": "m5-2", "num": "5.2", "court": "Fonctions : partager une règle de calcul", "qcm": "5.2", "parent": "m5", "md": "## 5.2 — Fonctions : partager une règle de calcul\n\n**Idée clé** : une fonction nomme une règle de calcul qui renvoie une seule valeur, utilisable partout où SQL accepte une expression (`SELECT`, `WHERE`, vue, procédure, `formula` GORM). Elle garantit qu'écrans, rapports et procédures arrondissent de la même façon.\n\n**Réflexe A1** : une méthode utilitaire statique Java (`Montants.ligneHt(...)`), parfois recopiée dans un `@Formula` ou une `@Query`. Deux implémentations de la même règle finissent par diverger d'un centime.\n\n### Deux familles\n\n| Famille | Caractéristique déclarée | Exemple Facturo | Équivalent PostgreSQL |\n| --- | --- | --- | --- |\n| Pure : ne dépend que de ses paramètres | `DETERMINISTIC` | `f_montant_ligne_ht(qte, pu, remise)` | `IMMUTABLE` |\n| Lit des tables | `READS SQL DATA`, non déterministe | `f_total_facture_ttc(facture_id)` | `STABLE` |\n\n```sql\nCREATE OR REPLACE FUNCTION f_montant_ligne_ht(p_qte INT, p_pu DECIMAL(12,2), p_remise DECIMAL(5,2))\n  RETURNS DECIMAL(12,2) DETERMINISTIC\n  RETURN ROUND(p_qte * p_pu * (1 - COALESCE(p_remise, 0) / 100), 2);\n\nCREATE OR REPLACE FUNCTION f_montant_ligne_ttc(p_qte INT, p_pu DECIMAL(12,2), p_remise DECIMAL(5,2), p_tva DECIMAL(5,2))\n  RETURNS DECIMAL(12,2) DETERMINISTIC\n  RETURN ROUND(f_montant_ligne_ht(p_qte, p_pu, p_remise) * (1 + p_tva / 100), 2);   -- une fonction en compose une autre\n\nCREATE OR REPLACE FUNCTION f_total_facture_ttc(p_facture_id BIGINT)\n  RETURNS DECIMAL(12,2) READS SQL DATA\nBEGIN\n  DECLARE v_total DECIMAL(12,2);\n  SELECT COALESCE(SUM(f_montant_ligne_ttc(quantite, prix_unitaire_ht, remise_pct, taux_tva)), 0)\n    INTO v_total FROM ligne_facture WHERE facture_id = p_facture_id;\n  RETURN v_total;\nEND;\n```\n\nTest immédiat dans le client SQL, avant tout code Grails : `SELECT f_montant_ligne_ht(3, 12.90, 5);` doit renvoyer `36.77`.\n\n### Appel depuis Grails\n\n| Besoin | Moyen | Exemple |\n| --- | --- | --- |\n| Valeur affichée avec l'entité | Propriété `formula` (lecture seule) | `montantHt formula: 'f_montant_ligne_ht(quantite, prix_unitaire_ht, remise_pct)'` |\n| Valeur isolée | `groovy.sql.Sql` | `new Sql(dataSource).firstRow('SELECT f_total_facture_ttc(?) AS ttc', [id]).ttc` |\n| Valeur dans une liste | Utilisée dans une vue (5.3) | `v_facture_totaux` agrège `f_montant_ligne_ttc` |\n\n### Quand l'utiliser\n\n- Une règle unitaire (montant, arrondi, conversion) reprise par plusieurs vues, procédures ou rapports.\n- Une règle que des outils hors Grails (export SQL, BI) doivent appliquer à l'identique.\n\n### Quand s'en abstenir\n\n- **Une fonction qui lit des tables, appelée ligne par ligne dans une liste.** `SELECT id, f_total_facture_ttc(id) FROM facture` lance une sous-requête par facture : c'est le N+1 déplacé dans la base. On agrège avec `GROUP BY` (5.3).\n- Une logique avec beaucoup de branches, du formatage de texte, ou une règle commerciale qui change chaque trimestre : Groovy est plus lisible et plus facile à tester.\n- Toute écriture : par convention, une fonction ne modifie jamais de données ; c'est le rôle de la procédure.\n\n### Pièges\n\n| Piège | Conséquence | Parade |\n| --- | --- | --- |\n| Filtrer avec `WHERE f(colonne) > x` | L'index sur `colonne` n'est plus utilisable | Filtrer sur la colonne brute, ou stocker la valeur |\n| Déclarer `DETERMINISTIC` une fonction qui lit des tables | Résultats faux avec la réplication et le cache | Déclarer la caractéristique exacte |\n| Oublier `COALESCE` | Un paramètre `NULL` rend tout le résultat `NULL` | `COALESCE(p, 0)` sur les paramètres optionnels |\n| `FLOAT` ou `DOUBLE` | Erreurs d'arrondi au centime | `DECIMAL(12,2)`, mappé en `BigDecimal` |\n\n### Ce qu'il faut retenir\n\n- Une fonction = une règle de calcul, une seule valeur, aucune écriture.\n- Pure : `DETERMINISTIC`. Lit des tables : `READS SQL DATA`, et jamais appelée ligne par ligne dans une liste.\n- Côté GORM, la porte d'entrée naturelle est `formula`.\n"}, {"id": "m5-3", "num": "5.3", "court": "Vues : exposer un résultat calculé", "qcm": "5.3", "parent": "m5", "md": "## 5.3 — Vues : exposer un résultat calculé\n\n**Idée clé** : une vue est une requête `SELECT` nommée, stockée en base et recalculée à chaque lecture. Pour GORM elle ressemble à une table : on la mappe sur une domain class en lecture seule, et toute la puissance des finders, des `where`, du tri et de la pagination s'applique à un résultat calculé par la base.\n\n**Réflexe A1** : une `@Query` avec projection dans un repository, ou un DTO rempli par une boucle dans le service. La requête n'existe que dans l'application Java ; un rapport SQL ou un autre programme doit la réécrire.\n\n### Trois usages\n\n| Usage | Exemple | Ce que la vue apporte |\n| --- | --- | --- |\n| Jointure aplatie | factures + raison sociale du client | Une ligne lisible sans parcourir d'associations |\n| Agrégat | `v_facture_totaux` : nombre de lignes, total HT, total TTC par facture | Les totaux arrivent avec la liste, sans N+1 |\n| Projection | n'exposer que certaines colonnes à un outil de reporting | Un contrat stable, indépendant du schéma |\n\n### La vue du fil rouge\n\n```sql\nCREATE OR REPLACE VIEW v_facture_totaux AS\nSELECT f.id AS facture_id, f.numero, f.statut, f.date_facture,\n       c.id AS client_id, c.raison_sociale,\n       COUNT(l.id) AS nb_lignes,\n       COALESCE(SUM(f_montant_ligne_ht(l.quantite, l.prix_unitaire_ht, l.remise_pct)), 0) AS total_ht,\n       COALESCE(SUM(f_montant_ligne_ttc(l.quantite, l.prix_unitaire_ht, l.remise_pct, l.taux_tva)), 0) AS total_ttc\n  FROM facture f\n  JOIN client c             ON c.id = f.client_id\n  LEFT JOIN ligne_facture l ON l.facture_id = f.id\n GROUP BY f.id, f.numero, f.statut, f.date_facture, c.id, c.raison_sociale;\n```\n\nElle réutilise les fonctions **pures** de 5.2 à l'intérieur d'un `SUM`, et non `f_total_facture_ttc(f.id)` qui relirait les lignes pour chaque facture. Le `LEFT JOIN` garde les brouillons sans ligne, à 0,00 €.\n\n### Mapping GORM en lecture seule\n\n```groovy\nclass FactureTotaux {\n    String numero\n    StatutFacture statut\n    Date dateFacture\n    Long clientId\n    String raisonSociale\n    Integer nbLignes\n    BigDecimal totalHt\n    BigDecimal totalTtc\n\n    BigDecimal getTotalTva() { (totalTtc ?: 0) - (totalHt ?: 0) }   // dérivé en Groovy : simple soustraction\n    static transients = ['totalTva']\n\n    static mapping = {\n        table 'v_facture_totaux'\n        id column: 'facture_id', generator: 'assigned'   // DOIT être unique par ligne de la vue\n        version false                                    // une vue n'a pas de colonne version\n        dateFacture type: 'date'\n        statut enumType: 'string'\n    }\n    def beforeInsert() { throw new UnsupportedOperationException('Vue en lecture seule') }\n    def beforeUpdate() { throw new UnsupportedOperationException('Vue en lecture seule') }\n    def beforeDelete() { throw new UnsupportedOperationException('Vue en lecture seule') }\n}\n\n// Tout GORM s'applique au résultat calculé :\nFactureTotaux.where { clientId == cid && statut == StatutFacture.EMISE }\n             .list(max: 10, offset: 0, sort: 'totalTtc', order: 'desc')\n```\n\n| A1 — Spring | A2 — Grails |\n| --- | --- |\n| `@Entity @Immutable @Table(name = \"v_facture_totaux\")` | domain class + `version false` + événements qui lèvent une exception |\n| `@Subselect(\"select ...\")` (Hibernate) | pas d'équivalent : on crée la vue en base, elle reste partageable |\n| `interface FactureTotauxProjection` + `@Query` | `FactureTotaux.where { ... }` |\n\n### Performance : vérifier, pas supposer\n\nUne vue qui contient un `GROUP BY` est calculée comme une table dérivée. MariaDB sait y pousser le filtre de la requête appelante : sur `SELECT * FROM v_facture_totaux WHERE client_id = 3`, `EXPLAIN` montre que la table `client` n'est lue que pour une ligne à l'intérieur de la vue. Ce comportement dépend de la forme de la vue ; on le contrôle avec `EXPLAIN` dès qu'une vue sert une liste paginée.\n\n### Quand l'utiliser\n\n- Le même résultat calculé sert plusieurs écrans, une recherche paginée, un rapport.\n- Une liste doit afficher des agrégats par ligne : c'est le remède au N+1 de 5.1.\n- On veut offrir un contrat stable à un outil externe sans lui livrer le schéma.\n\n### Quand s'en abstenir\n\n- **Écrire** : même si certaines vues simples sont modifiables, Facturo n'écrit jamais au travers d'une vue.\n- **Un paramètre obligatoire ou un contrôle avant lecture** (période valide, droits) : une vue ne prend pas de paramètre, on passe à la procédure qui renvoie des lignes (5.4).\n- **Empiler des vues de vues** : au troisième niveau, personne ne sait plus ce qui est calculé ni à quel coût.\n\n### Pièges\n\n| Piège | Conséquence | Parade |\n| --- | --- | --- |\n| `id` non unique dans la vue | Hibernate confond les lignes : doublons ou valeurs mélangées à l'écran | Une colonne réellement unique par ligne mappée en `id` |\n| `SELECT *` dans la définition | La liste des colonnes est figée à la création : une colonne ajoutée plus tard n'apparaît pas | Lister les colonnes ; recréer la vue dans le script de migration |\n| Oublier `version false` | Erreur SQL : colonne `version` inconnue | Toujours `version false` sur une vue |\n| Modifier une vue « en direct » | Le mapping GORM et les écrans cassent sans prévenir | Une vue est un contrat : script versionné dans `src/main/sql` |\n\n### Ce qu'il faut retenir\n\n- Une vue = une requête nommée et partagée ; GORM la lit comme une table en lecture seule.\n- `id` unique par ligne, `version false`, écritures interdites.\n- Agréger avec des fonctions pures dans un `GROUP BY`, et contrôler le plan avec `EXPLAIN`.\n"}, {"id": "m5-4", "num": "5.4", "court": "Procédures stockées : une opération atomique en plusieurs écritures", "qcm": "5.4", "parent": "m5", "md": "## 5.4 — Procédures stockées : une opération atomique en plusieurs écritures\n\n**Idée clé** : une procédure exécute dans la base une opération métier faite de plusieurs instructions, appelée explicitement par `CALL`. Elle est utile quand plusieurs écritures doivent réussir ensemble, sous concurrence, et qu'elles peuvent s'exprimer en ordres ensemblistes.\n\n### Le réflexe A1 : l'émission en Java\n\n```java\n@Transactional\npublic String emettre(Long id) {\n  Facture f = factures.findByIdForUpdate(id);                 // @Lock(PESSIMISTIC_WRITE)\n  if (f.getStatut() != BROUILLON) throw new FactureDejaEmiseException(id);\n  if (f.getLignes().isEmpty()) throw new FactureVideException(id);\n  for (LigneFacture l : f.getLignes()) {                       // 1 lecture + 1 UPDATE par ligne\n    Produit p = l.getProduit();\n    if (p.getStock() < l.getQuantite()) throw new StockInsuffisantException(p);\n    p.setStock(p.getStock() - l.getQuantite());\n  }\n  int annee = Year.now().getValue();\n  SequenceFacture s = sequences.findByAnneeForUpdate(annee).orElseGet(() -> sequences.save(new SequenceFacture(annee)));\n  s.incrementer();\n  f.emettre(String.format(\"FAC-%d-%05d\", annee, s.getDernier()));\n  return f.getNumero();\n}\n```\n\nCe code fonctionne, mais il émet un `UPDATE` par ligne et son exactitude tient à un détail : deux lignes du même produit pointent vers le même objet `Produit` en session, donc le second contrôle voit le stock déjà décrémenté. Qu'un développeur sépare « tout contrôler » puis « tout appliquer », refactoring courant, et deux lignes de 5 sur un stock de 8 passent toutes les deux. La version ensembliste cumule par produit avant de contrôler, par construction.\n\n### La procédure\n\n```sql\nCREATE OR REPLACE PROCEDURE p_emettre_facture(IN p_facture_id BIGINT, OUT p_numero VARCHAR(20))\n  MODIFIES SQL DATA\nBEGIN\n  DECLARE v_statut VARCHAR(10);\n  DECLARE v_annee  INT DEFAULT YEAR(CURDATE());\n\n  SELECT statut INTO v_statut FROM facture WHERE id = p_facture_id FOR UPDATE;   -- verrou de ligne\n  IF v_statut IS NULL THEN SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'FACTURE_INCONNUE'; END IF;\n  IF v_statut <> 'BROUILLON' THEN SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'FACTURE_DEJA_EMISE'; END IF;\n  IF NOT EXISTS (SELECT 1 FROM ligne_facture WHERE facture_id = p_facture_id) THEN\n    SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'FACTURE_VIDE';\n  END IF;\n  IF EXISTS (SELECT 1 FROM ligne_facture l JOIN produit p ON p.id = l.produit_id\n              WHERE l.facture_id = p_facture_id\n              GROUP BY p.id, p.stock HAVING SUM(l.quantite) > p.stock) THEN       -- cumul par produit\n    SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'STOCK_INSUFFISANT';\n  END IF;\n\n  INSERT INTO sequence_facture (annee, dernier) VALUES (v_annee, 1)\n    ON DUPLICATE KEY UPDATE dernier = dernier + 1;                                -- séquence verrouillée\n  SELECT CONCAT('FAC-', v_annee, '-', LPAD(dernier, 5, '0')) INTO p_numero\n    FROM sequence_facture WHERE annee = v_annee;\n\n  UPDATE produit p\n    JOIN (SELECT produit_id, SUM(quantite) AS qte FROM ligne_facture\n           WHERE facture_id = p_facture_id GROUP BY produit_id) l ON l.produit_id = p.id\n     SET p.stock = p.stock - l.qte, p.version = p.version + 1;                    -- un seul ordre pour tout le stock\n\n  UPDATE facture SET statut = 'EMISE', numero = p_numero, date_emission = NOW(), version = version + 1\n   WHERE id = p_facture_id;\nEND;\n```\n\nLes `version = version + 1` préviennent Hibernate : un utilisateur qui avait ouvert ce produit ou cette facture avant l'émission recevra un conflit de verrouillage optimiste au lieu d'écraser le nouveau stock.\n\n### Paramètres\n\n| Mode | Rôle | Lecture côté Groovy |\n| --- | --- | --- |\n| `IN` | entrée, valeur par défaut | simple valeur dans la liste : `[factureId]` |\n| `OUT` | sortie, écrite par la procédure | type JDBC dans la liste (`Sql.VARCHAR`), valeur reçue par la closure |\n| `INOUT` | entrée lue puis réécrite | `Sql.inout(Sql.VARCHAR(valeur))` |\n\n### Appel depuis Grails\n\n```groovy\n@Transactional\nclass FactureService {\n    def dataSource                                   // même connexion que la transaction Hibernate\n\n    String emettre(Long factureId) {\n        Facture.withSession { it.flush() }           // 1. pousser en base ce que la session a en attente\n        String numero = null\n        try {\n            new Sql(dataSource).call('{call p_emettre_facture(?, ?)}', [factureId, Sql.VARCHAR]) { String n ->\n                numero = n\n            }\n        } catch (SQLException e) {\n            throw new EmissionImpossibleException(codeMetier(e), e)   // 2. RuntimeException -> rollback\n        }\n        Facture.get(factureId)?.refresh()             // 3. la session ne voit pas ce que la procédure a écrit\n        numero\n    }\n}\n```\n\n### Qui possède la transaction : procédure participante ou autonome\n\nLe modèle qu'on trouve dans la plupart des tutoriels MySQL (`START TRANSACTION`, `EXIT HANDLER` qui fait `ROLLBACK`, résultat dans `OUT p_success` et `OUT p_error`) convient à une procédure appelée seule. Appelé depuis un service `@Transactional`, il casse deux choses : le `START TRANSACTION` valide implicitement ce que Grails a déjà écrit, et l'erreur avalée dans `p_error` ne déclenche plus aucun rollback.\n\n| Modèle | Transaction | Erreur | Usage dans Facturo |\n| --- | --- | --- | --- |\n| Participante | Celle de l'appelant | `SIGNAL`, ou `RESIGNAL` après nettoyage | Toute procédure appelée par l'application |\n| Autonome | `START TRANSACTION` … `COMMIT` dans la procédure | `EXIT HANDLER` + `ROLLBACK` + `RESIGNAL` | Traitements lancés hors application (cron, reprise de données) |\n\nSi une procédure participante doit intercepter une erreur, elle la relance :\n\n```sql\nDECLARE EXIT HANDLER FOR SQLEXCEPTION\nBEGIN\n  GET DIAGNOSTICS CONDITION 1 @etat = RETURNED_SQLSTATE, @msg = MESSAGE_TEXT;\n  -- nettoyage éventuel (table temporaire, variable de session)\n  RESIGNAL;                       -- l'appelant reçoit toujours 45000 / FACTURE_DEJA_EMISE\nEND;\n```\n\nUne écriture faite dans ce gestionnaire, par exemple pour journaliser l'échec, est annulée avec la transaction de l'appelant. Pour tracer un échec, on journalise côté Groovy après le rollback.\n\n### Procédure qui renvoie des lignes\n\nMariaDB n'a pas de fonction qui renvoie une table, comme le `RETURNS TABLE` de PostgreSQL. Quand une lecture exige un paramètre obligatoire ou un contrôle, la procédure se termine par un `SELECT` :\n\n```sql\nCREATE OR REPLACE PROCEDURE p_releve_client(IN p_client_id BIGINT, IN p_du DATE, IN p_au DATE)\n  READS SQL DATA\nBEGIN\n  IF p_au < p_du THEN SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'PERIODE_INVALIDE'; END IF;\n  SELECT facture_id, numero, statut, date_facture, total_ht, total_ttc\n    FROM v_facture_totaux\n   WHERE client_id = p_client_id AND date_facture BETWEEN p_du AND p_au\n   ORDER BY date_facture;\nEND;\n```\n\n```java\n// A1 — Spring\nList<Map<String, Object>> releve = jdbcTemplate.queryForList(\"{call p_releve_client(?, ?, ?)}\", id, du, au);\n```\n\n```groovy\n// A2 — Grails : chaque ligne est un GroovyRowResult, lisible comme une Map (r.numero, r.total_ttc)\nList releve = new Sql(dataSource).rows('{call p_releve_client(?, ?, ?)}', [clientId, du, au])\n```\n\n### Quand l'utiliser\n\n- Plusieurs écritures liées qui doivent réussir ou échouer ensemble, avec un risque de concurrence (numérotation, stock).\n- Une opération qui s'exprime en quelques ordres ensemblistes au lieu d'une boucle de N mises à jour.\n- Une opération que d'autres programmes que Grails doivent exécuter à l'identique.\n\n### Quand s'en abstenir\n\n- **Effets extérieurs** : envoyer un e-mail, appeler une API, écrire un fichier. Le service Groovy le fait autour de l'appel, idéalement après le commit.\n- **Le CRUD simple** : GORM le fait mieux, avec validation et messages.\n- **Une règle très ramifiée qui change souvent** : la procédure devient un « service caché » de plusieurs centaines de lignes, sans tests ni revue de code.\n\n### Pièges\n\n| Piège | Conséquence | Parade |\n| --- | --- | --- |\n| `START TRANSACTION` dans une procédure appelée par l'application | Commit implicite du travail Grails | Procédure participante |\n| Erreur rendue dans un `OUT` au lieu d'un `SIGNAL` | Le service ne sait pas annuler | `SIGNAL` / `RESIGNAL` |\n| Pas de `flush` avant l'appel | La procédure ne voit pas les lignes ajoutées | `Facture.withSession { it.flush() }` |\n| Pas de `refresh` après l'appel | L'écran affiche l'ancien statut | `refresh()` ou nouvelle lecture |\n| Ne pas incrémenter `version` | Hibernate écrase silencieusement le stock recalculé | `version = version + 1` dans chaque `UPDATE` |\n| Script avec `DELIMITER` exécuté par JDBC | Erreur de syntaxe | `DELIMITER` n'existe que dans le client `mariadb` |\n\n### Ce qu'il faut retenir\n\n- Une procédure = une opération atomique en ordres ensemblistes, appelée par un service qui possède la transaction.\n- Erreur métier : `SIGNAL SQLSTATE '45000'`, traduite en exception Groovy, donc rollback.\n- Flush avant, refresh après, `version + 1` dans les `UPDATE`.\n"}, {"id": "m5-5", "num": "5.5", "court": "Triggers : garantir une règle quel que soit l'auteur de l'écriture", "qcm": "5.5", "parent": "m5", "md": "## 5.5 — Triggers : garantir une règle quel que soit l'auteur de l'écriture\n\n**Idée clé** : un trigger est du code que la base exécute automatiquement avant ou après chaque `INSERT`, `UPDATE` ou `DELETE` d'une ligne. Personne ne l'appelle : c'est sa force, puisqu'il s'applique aussi à un script SQL ou à un autre programme, et son danger, puisqu'un développeur Grails ne le voit pas dans le code.\n\n**Réflexe A1** : les *entity listeners* JPA (`@PrePersist`, `@PreUpdate`) et Hibernate Envers pour l'audit. Ils ne se déclenchent que pour les écritures faites par JPA ; un `UPDATE` lancé depuis un client SQL ou par une procédure leur échappe.\n\n### Déclaratif d'abord\n\nAvant d'écrire un trigger, on vérifie qu'une contrainte déclarative ne suffit pas. Elle est plus lisible, plus rapide, et ne peut pas être oubliée dans une branche de code.\n\n| Règle | Outil | Exemple Facturo |\n| --- | --- | --- |\n| Valeur obligatoire, valeur par défaut | `NOT NULL`, `DEFAULT` | `statut DEFAULT 'BROUILLON'` |\n| Unicité | `UNIQUE` | `uk_facture_numero` |\n| Référence existante | `FOREIGN KEY` | `fk_ligne_facture_produit` |\n| Condition sur la ligne elle-même | `CHECK` | `ck_produit_stock CHECK (stock >= 0)` |\n| Condition qui lit une autre table, ou trace d'audit | **Trigger** | gel des lignes d'une facture émise, journal des statuts |\n\n### BEFORE ou AFTER\n\n| Moment | Sert à | Accès | Exemple |\n| --- | --- | --- | --- |\n| `BEFORE` | refuser (`SIGNAL`) ou compléter la ligne avant écriture | `NEW` modifiable, `OLD` en lecture | `trg_ligne_facture_bi` : refuse une ligne sur une facture émise |\n| `AFTER` | répercuter dans une autre table une écriture réussie | `NEW` et `OLD` en lecture | `trg_facture_au` : journalise le changement de statut |\n\n```sql\n-- BEFORE : règle de gel, qui lit une autre table (impossible avec CHECK)\nCREATE OR REPLACE TRIGGER trg_ligne_facture_bi BEFORE INSERT ON ligne_facture FOR EACH ROW\nBEGIN\n  IF (SELECT statut FROM facture WHERE id = NEW.facture_id) <> 'BROUILLON' THEN\n    SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'FACTURE_NON_MODIFIABLE';\n  END IF;\nEND;\n-- même contrôle en BEFORE UPDATE et BEFORE DELETE sur OLD.facture_id\n\n-- AFTER : audit des changements de statut, modèle de l'exercice 7\nCREATE OR REPLACE TRIGGER trg_facture_au AFTER UPDATE ON facture FOR EACH ROW\nBEGIN\n  IF NOT (OLD.statut <=> NEW.statut) THEN                     -- <=> : comparaison qui gère NULL\n    INSERT INTO journal_audit (table_nom, ligne_id, action, ancienne_valeur, nouvelle_valeur, utilisateur_sql)\n    VALUES ('facture', NEW.id, 'STATUT', OLD.statut, NEW.statut, USER());\n  END IF;\nEND;\n```\n\nL'émission par `p_emettre_facture` déclenche `trg_facture_au` : sur le jeu d'essai, le journal contient dès l'installation la ligne `facture 2 : BROUILLON → EMISE`.\n\n### Ce que Grails voit\n\n| Situation | Côté Grails | À faire |\n| --- | --- | --- |\n| Un `BEFORE` refuse par `SIGNAL` | Exception à l'écriture, au flush ou au commit | Traduire le code métier en message, comme pour une procédure |\n| Un `BEFORE` modifie `NEW.colonne` | L'objet en mémoire garde l'ancienne valeur | `refresh()` après l'enregistrement |\n| Un `AFTER` écrit dans une autre table | Rien, tant qu'on ne relit pas cette table | Normal pour un journal |\n\n### Quand l'utiliser\n\n- Un invariant qui doit tenir quel que soit le programme qui écrit, et qu'aucune contrainte déclarative ne sait exprimer.\n- Un audit exhaustif des changements, y compris ceux faits par des procédures ou des scripts.\n\n### Quand s'en abstenir\n\n- **La logique métier principale** : un calcul ou un enchaînement que le développeur doit comprendre en lisant le service. Le trigger le rend invisible.\n- **Les cascades** : un trigger qui écrit dans une table qui a elle-même un trigger. Le comportement devient impossible à suivre.\n- **Ce qu'un `CHECK`, une `FOREIGN KEY` ou un `UNIQUE` sait faire.**\n\n### Pièges vérifiés sur MariaDB 10.11\n\n| Piège | Ce qui se passe | Parade |\n| --- | --- | --- |\n| `CURRENT_USER()` pour tracer l'auteur | Renvoie le propriétaire du trigger (ici `root@localhost`), pas le compte connecté | `USER()` renvoie le compte de connexion (`facturo@...`) |\n| Compte SQL ≠ utilisateur humain | Toute l'application se connecte avec le même compte | Positionner `SET @utilisateur_app = ?` depuis Groovy et le lire dans le trigger |\n| Modifier la table qui a déclenché le trigger | Erreur 1442 : table déjà utilisée par l'instruction | Modifier `NEW` dans un `BEFORE`, ou repenser la règle |\n| Suppression en cascade par `ON DELETE CASCADE` | Les triggers de la table enfant ne sont **pas** déclenchés | Ne pas compter sur un trigger pour auditer ces suppressions |\n| Erreur dans un trigger | Toute l'instruction est annulée, ainsi que les écritures du trigger | C'est voulu ; le message doit être un code métier clair |\n\n### Ce qu'il faut retenir\n\n- Déclaratif d'abord ; trigger seulement pour une règle qui lit une autre table, ou pour l'audit.\n- `BEFORE` refuse ou complète ; `AFTER` répercute ailleurs.\n- Un trigger est invisible depuis Grails : on le documente dans le service qu'il protège, et on le teste en SQL.\n"}, {"id": "m5-6", "num": "5.6", "court": "Composer : choisir l'objet et assembler", "qcm": "5.6", "parent": "m5", "md": "## 5.6 — Composer : choisir l'objet et assembler\n\n**Idée clé** : une fonctionnalité réelle combine plusieurs objets, chacun à sa place. La bonne question n'est pas « SQL ou Groovy ? » mais « quelle part du besoin va où ? ». On découpe d'abord le besoin en morceaux, puis on fait descendre chaque morceau dans cet arbre.\n\n<div class=\"arbre\" data-arbre><\/div>\n\nL'ordre des questions compte : on écarte d'abord ce qui doit rester en Groovy, puis on traite les garanties avant les calculs. La réponse par défaut, quand aucune question ne répond oui, reste GORM dans un service.\n\n### Corrigé de l'atelier flash de 5.1\n\n| Besoin | Question qui tranche | Objet retenu |\n| --- | --- | --- |\n| Total TTC de chaque facture dans une liste paginée | 4 | Vue `v_facture_totaux` + domain `FactureTotaux` |\n| E-mail au client à l'émission | 1 | Service Groovy, après l'appel réussi |\n| Numérotation sans trou, deux serveurs | 3 | Procédure `p_emettre_facture` et sa séquence verrouillée |\n| Facture émise non modifiable, même par script | 2 | Trigger `BEFORE` ; intercepteur et service en plus pour un message clair |\n| Stock jamais négatif | 2 | `CHECK (stock >= 0)`, aucun trigger |\n\n### Une fonctionnalité assemblée : l'émission\n\n| Étape | Élément | Rôle |\n| --- | --- | --- |\n| 1 | `facture/show.gsp` | Bouton « Émettre », affiché seulement pour un brouillon |\n| 2 | `FactureController.emettre` | Reçoit l'id, traduit le code d'erreur en message i18n, redirige |\n| 3 | `FactureService.emettre` | Possède la transaction : flush, appel de la procédure, refresh |\n| 4 | `p_emettre_facture` | Contrôle, numérote, décrémente tout le stock en un ordre, change le statut |\n| 5 | `trg_facture_au` | Journalise le passage BROUILLON → EMISE |\n| 6 | `ck_produit_stock` | Filet : refuse un stock négatif si un contrôle a été oublié |\n| 7 | `FactureTotaux` sur `v_facture_totaux` | Relit les totaux de la page, calculés par `f_montant_ligne_ttc` |\n| 8 | `LigneFacture.montantHt` (`formula`) | Affiche le montant de chaque ligne, calculé par `f_montant_ligne_ht` |\n\nLa règle de montant est écrite une seule fois, dans `f_montant_ligne_ht`, et lue par quatre chemins : la propriété `formula`, la vue, la fonction TTC et la procédure de relevé. La règle de gel est au contraire tenue à trois niveaux (intercepteur, service, trigger), parce que chacun protège un chemin d'écriture différent.\n\n### Atelier (1 h) : la remise fidélité\n\n**Besoin** : un client dont le chiffre d'affaires TTC émis sur les 12 derniers mois dépasse un seuil obtient des points de remise supplémentaires sur les lignes ajoutées ensuite. Le seuil (10 000 €) et le bonus (2 points) sont fixés par le service commercial et changeront. La fiche client affiche son chiffre d'affaires sur 12 mois.\n\n**Consigne** : découper le besoin en morceaux, faire descendre chacun dans l'arbre, écrire le SQL et le Groovy, et justifier chaque choix en une phrase.\n\n**Corrigé attendu** :\n\n| Morceau | Question | Objet | Pourquoi pas autre chose |\n| --- | --- | --- | --- |\n| CA TTC sur 12 mois d'un client | 5 (appel pour un client) ou 4 (affichage en liste) | Fonction `f_ca_client_12m(client_id)` en `READS SQL DATA` pour la fiche ; vue agrégée si une liste de clients doit l'afficher | Appeler la fonction ligne par ligne dans une liste serait un N+1 en base |\n| Seuil et bonus | aucune | Table de paramètres lue par le service | Jamais en dur, ni dans le SQL ni dans le Groovy |\n| Décider d'appliquer le bonus | 1 et 2 : non ; règle commerciale changeante | `FactureService.ajouterLigne` | Un trigger cacherait une règle commerciale qui n'est pas un invariant |\n| Enregistrer la ligne | 3 : non, une seule écriture | GORM, comme avant | Une procédure n'apporterait rien |\n\n### Ce qu'il faut retenir\n\n- On découpe le besoin avant de choisir : une même fonctionnalité mélange presque toujours Groovy, GORM et plusieurs objets SQL.\n- Une règle de calcul s'écrit une fois en base et se lit par plusieurs chemins ; une décision qui change souvent reste en Groovy.\n- Les invariants se défendent en profondeur ; la transaction, elle, n'a qu'un propriétaire : le service.\n"}, {"id": "m6", "num": "6", "court": "Factoriser le transverse", "qcm": "6", "parent": null, "md": "## Module 6 — Factoriser le transverse\n\n**Besoin** : journaliser la durée de chaque action, interdire toute action d'édition sur une facture qui n'est plus brouillon, et afficher partout les montants et statuts de la même façon, en français. En A2 chacun de ces besoins tient dans un fichier posé au bon endroit, sans configuration.\n\n### Intercepteur\n\n```java\n// A1\npublic class DureeInterceptor implements HandlerInterceptor {\n  public boolean preHandle(HttpServletRequest req, HttpServletResponse res, Object h) {\n    req.setAttribute(\"t0\", System.nanoTime()); return true;\n  }\n  public void afterCompletion(HttpServletRequest req, HttpServletResponse res, Object h, Exception ex) {\n    log.info(\"{} {} ms\", req.getRequestURI(), (System.nanoTime() - (long) req.getAttribute(\"t0\")) / 1_000_000);\n  }\n}\n@Configuration class WebConfig implements WebMvcConfigurer {\n  public void addInterceptors(InterceptorRegistry r) { r.addInterceptor(new DureeInterceptor()); }\n}\n```\n\n```groovy\n// A2 — grails-app/controllers/facturo/DureeInterceptor.groovy\nclass DureeInterceptor {\n    DureeInterceptor() { matchAll() }\n    boolean before() { request.setAttribute('facturo.t0', System.nanoTime()); true }\n    boolean after()  { true }\n    void afterView() {\n        Long t0 = request.getAttribute('facturo.t0') as Long\n        log.info \"${controllerName}/${actionName} : ${(System.nanoTime() - t0).intdiv(1_000_000)} ms\"\n    }\n}\n\n// A2 — grails-app/controllers/facturo/FactureVerrouInterceptor.groovy\n// Attention : un intercepteur Grails 3.3 n'a PAS la méthode message() des contrôleurs.\nclass FactureVerrouInterceptor {\n    FactureService factureService                  // un intercepteur est un bean : injection par nom\n    MessageSource messageSource\n\n    FactureVerrouInterceptor() { match(controller: 'facture', action: ~/(ajouterLigne|supprimerLigne)/) }\n\n    boolean before() {\n        Long id = params.long('id')\n        if (id && !factureService.estModifiable(id)) {\n            flash.erreur = messageSource.getMessage('facture.non.modifiable', [id] as Object[],\n                    RequestContextUtils.getLocale(request))\n            redirect controller: 'facture', action: 'show', id: id\n            return false                              // l'action n'est pas exécutée\n        }\n        true\n    }\n}\n```\n\n### TagLib\n\nEn Thymeleaf on répète `${#numbers.formatDecimal(...)}` ou on écrit un fragment ; écrire un dialecte est rare. En Grails, un tag maison est une closure :\n\n```groovy\n// grails-app/taglib/facturo/FacturoTagLib.groovy\nclass FacturoTagLib {\n    static namespace = 'fac'\n    static defaultEncodeAs = [taglib: 'raw']   // on produit du HTML : on échappe nous-mêmes\n\n    /** <fac:montant valeur=\"${f.totalTtc}\"/> -> 1 234,50 € */\n    def montant = { attrs ->\n        out << g.formatNumber(number: attrs.valeur ?: 0, type: 'currency', currencyCode: 'EUR', locale: Locale.FRANCE)\n    }\n\n    /** <fac:statut valeur=\"${f.statut}\"/> -> badge coloré et traduit */\n    def statut = { attrs ->\n        def s = attrs.valeur\n        out << \"<span class='badge badge-${s?.name()?.toLowerCase()}'>\"\n        out << g.message(code: \"statut.${s}\").encodeAsHTML() << '<\/span>'\n    }\n}\n```\n\n### Internationalisation\n\n| Usage | A1 | A2 |\n| --- | --- | --- |\n| Fichier | `messages_fr.properties` | `grails-app/i18n/messages_fr.properties` |\n| Dans la vue | `th:text=\"#{facture.titre}\"` | `<g:message code=\"facture.titre\"/>` |\n| Dans le contrôleur | `messageSource.getMessage(...)` | `message(code: 'client.cree', args: [c.code])` |\n| Erreur de validation | `{jakarta.validation...}` ou code `BindingResult` | `<classe>.<propriété>.<contrainte>` |\n| Changer de langue | `LocaleChangeInterceptor` à configurer | paramètre `?lang=en` actif par défaut |\n\n### Ce qu'il faut retenir\n\n- **Un intercepteur se déclare par son nom** (`*Interceptor`) et son périmètre par `match()` / `matchAll()` dans le constructeur ; `before()` qui renvoie `false` stoppe la requête.\n- **`after()`** s'exécute avant le rendu de la vue (on peut modifier `model`), **`afterView()`** après.\n- **Une TagLib** est un *bean* : on peut y injecter un service. Ses tags sont appelables dans toutes les GSP et dans les contrôleurs (`fac.montant(valeur: x)`).\n- **Encodage** : par défaut la sortie d'un tag est échappée ; quand le tag produit du HTML, on déclare `raw` et on échappe les données (`encodeAsHTML()`).\n"}, {"id": "pieges", "num": "", "court": "Pièges courants", "qcm": null, "parent": null, "md": "## Pièges courants pour un développeur Spring\n\nCes douze erreurs reviennent dans presque tous les premiers projets Grails d'un développeur Spring ; elles servent aussi de grille de relecture des exercices.\n\n| Piège | Symptôme | Correction |\n| --- | --- | --- |\n| `save()` sans contrôle du retour | Rien n'est enregistré, aucune erreur | `save(failOnError: true)`, ou tester `hasErrors()`, ou passer par un Data Service |\n| `dbCreate` laissé à `create-drop` | Vues, fonctions, procédures disparues au démarrage | `dbCreate: none` dans tous les environnements |\n| `org.springframework...Transactional` sur un service | Comportement différent selon le contexte, pas de session GORM | `grails.gorm.transactions.Transactional` |\n| `belongsTo` sur une simple référence | Supprimer un client supprime ses factures | `belongsTo` uniquement pour la composition |\n| Exception métier « checked » | Pas de rollback | Étendre `RuntimeException` |\n| Logique métier dans le contrôleur | Pas de transaction, code non testable | Contrôleur mince, service transactionnel |\n| Pas de `flush` avant une procédure | La procédure ne voit pas les lignes ajoutées | `Facture.withSession { it.flush() }` |\n| Pas de `refresh` après une procédure | La page affiche l'ancien statut | `facture.refresh()` ou relire l'objet |\n| `START TRANSACTION` dans une procédure | Commit implicite de la transaction Grails | La transaction appartient au service appelant |\n| Liaison de masse non maîtrisée | Un champ caché modifie `statut` ou `numero` | `bindable: false`, `bindData` avec `include`, command object |\n| `${raw(...)}` sur une saisie utilisateur | Faille XSS | Laisser l'encodage par défaut ; `raw` seulement pour du HTML généré |\n| Associations parcourues dans une boucle GSP | N+1 requêtes (visible avec `logSql: true`) | `fetch: [x: 'join']`, `join('x')` sur un `where`, ou une vue SQL |\n\nAstuce de diagnostic : `logSql: true` et `formatSql: true` dans le bloc `dataSource` affichent chaque requête, l'équivalent de `spring.jpa.show-sql`.\n"}], "qcm": {"titre": "QCM Facturo — de Spring Boot à Grails 3.3", "version": "2026-10-23", "modules": {"0": "Module 0 — Structure", "1": "Module 1 — Lister", "2": "Module 2 — Valider", "3": "Module 3 — Relations et services", "4": "Module 4 — Rechercher", "5.1": "Séance 5.1 — Du Java au SQL ensembliste", "5.2": "Séance 5.2 — Fonctions", "5.3": "Séance 5.3 — Vues", "5.4": "Séance 5.4 — Procédures stockées", "5.5": "Séance 5.5 — Triggers", "5.6": "Séance 5.6 — Composer", "6": "Module 6 — Transverse", "git-ia": "Pratique Git et IA"}, "questions": [{"id": "Q1", "module": "0", "question": "Quel fichier joue le rôle d'un `CommandLineRunner` pour insérer des données au démarrage ?", "options": [{"texte": "`Application.groovy`", "correcte": false}, {"texte": "`BootStrap.groovy`", "correcte": true}, {"texte": "`UrlMappings.groovy`", "correcte": false}, {"texte": "`application.yml`", "correcte": false}], "justification": "`BootStrap.init` s'exécute au démarrage, par environnement."}, {"id": "Q2", "module": "0", "question": "Pourquoi Facturo impose-t-il `dbCreate: none` ?", "options": [{"texte": "Pour accélérer le démarrage", "correcte": false}, {"texte": "Parce qu'Hibernate recréerait le schéma et perdrait vues, fonctions et procédures", "correcte": true}, {"texte": "Parce que MariaDB n'accepte pas d'autre valeur", "correcte": false}, {"texte": "Pour désactiver le cache de second niveau", "correcte": false}], "justification": "Hibernate ne gère que les tables qu'il connaît ; vues et routines seraient perdues."}, {"id": "Q3", "module": "0", "question": "Où place-t-on un service métier ?", "options": [{"texte": "`src/main/groovy`, annoté `@Service` de Spring", "correcte": false}, {"texte": "`grails-app/services/facturo/XxxService.groovy`", "correcte": true}, {"texte": "`grails-app/conf`", "correcte": false}, {"texte": "`grails-app/init`", "correcte": false}], "justification": "Le répertoire et le suffixe `Service` font le bean."}, {"id": "Q4", "module": "0", "question": "Que provoque le renommage de `ClientController` en `ClientsController` ?", "options": [{"texte": "Rien, seule la classe change", "correcte": false}, {"texte": "Les URL deviennent `/clients/...` et les vues sont cherchées dans `views/clients`", "correcte": true}, {"texte": "Seul le nom du bean Spring change", "correcte": false}, {"texte": "Une erreur de compilation", "correcte": false}], "justification": "Le nom logique du contrôleur dérive du nom de classe."}, {"id": "Q5", "module": "0", "question": "Quelle version de Java utiliser avec Grails 3.3 ?", "options": [{"texte": "Java 8", "correcte": true}, {"texte": "Java 17", "correcte": false}, {"texte": "Java 21", "correcte": false}, {"texte": "N'importe laquelle", "correcte": false}], "justification": "Grails 3.3 vise Java 8."}, {"id": "Q6", "module": "1", "question": "`Client.findAllByActif(true)` est :", "options": [{"texte": "Une méthode à déclarer dans une interface repository", "correcte": false}, {"texte": "Un *dynamic finder* déduit de son nom à l'exécution", "correcte": true}, {"texte":
